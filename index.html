<style>
  :root {
    --ivory: #fbfbf9;
    --ivory-2: #f2f1ee;
    --ink: #1b1815;
    --ink-body: #3f3a35;
    --ink-soft: #5e574f;
    --pink: #c2185b;
    --pink-bright: #e0457f;
    --pink-soft: #f8e6ed;
    --line: rgba(27, 24, 21, 0.12);
    --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", serif;

  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ivory);
    color: var(--ink-body);
    font-family: var(--font-body);
    font-size: 20px;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px clamp(24px, 5vw, 48px) 32px;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .eyebrow {
    font-size: 12.8px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .langs { display: flex; gap: 14px; }
  .langs button {
    background: none; border: none; padding: 2px 0; cursor: pointer;
    font: 600 12.8px var(--font-body); letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-soft); border-bottom: 1px solid transparent; transition: color .3s var(--ease);
  }
  .langs button:hover { color: var(--ink); }
  .langs button.on { color: var(--pink); border-bottom-color: var(--pink); }

  /* Title */
  .title { margin-top: clamp(48px, 9vh, 96px); text-align: center; }
  h1 {
    font-family: var(--font-display); font-weight: 300; color: var(--ink);
    font-size: clamp(44px, 8vw, 76px); line-height: 1; letter-spacing: -0.035em;
  }
  h1 em { font-style: italic; color: var(--pink); }
  .tagline { margin-top: 18px; font-style: italic; font-size: 22px; color: var(--ink-soft); }

  /* Orb */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 24px; }
  .orb {
    position: relative; width: 168px; height: 168px; border-radius: 50%;
    border: 1px solid var(--ink); background: transparent; cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .5s var(--ease), transform .5s var(--ease);
  }
  .orb:hover { transform: scale(1.02); }
  .orb::before, .orb::after {
    content: ""; position: absolute; inset: -1px; border-radius: 50%;
    border: 1px solid var(--pink); opacity: 0; pointer-events: none;
  }
  .orb .core {
    width: 10px; height: 10px; border-radius: 50%; background: var(--ink);
    transition: all .5s var(--ease);
  }
  .orb.listening { border-color: var(--pink); }
  .orb.listening .core { background: var(--pink); width: 18px; height: 18px; }
  .orb.listening::before { animation: ripple 2s var(--ease) infinite; }
  .orb.listening::after  { animation: ripple 2s var(--ease) 1s infinite; }
  .orb.thinking .core { animation: breathe 1.4s ease-in-out infinite; }
  .orb.speaking { border-color: var(--pink); }
  .orb.speaking .core { background: var(--pink); animation: speak .9s ease-in-out infinite; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(2.2); opacity: .35; } }
  @keyframes speak { 0%,100% { transform: scale(1.6); } 50% { transform: scale(2.6); } }

  .hint {
    margin-top: 28px; min-height: 20px; text-align: center;
    font-size: 12.8px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-soft);
  }
  .heard { margin-top: 10px; min-height: 28px; text-align: center; font-style: italic; color: var(--ink-soft); max-width: 520px; }

  /* Transcript */
  .transcript { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-direction: column; gap: 22px; }
  .transcript:empty { display: none; }
  .turn .who {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;

  .turn.error p { color: var(--pink); font-style: italic; font-size: 17px; }

  .suggest { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .chip {
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
    font: italic 500 17px var(--font-body); color: var(--ink-body); transition: all .3s var(--ease);
  }
  .chip:hover { border-color: var(--pink); color: var(--pink); }
  .type { display: flex; gap: 12px; margin-top: 28px; border-bottom: 1px solid var(--line); }
  .type input {
    flex: 1; min-width: 0; border: none; background: transparent; outline: none; padding: 10px 0;
    font: italic 500 19px var(--font-body); color: var(--ink);
  }
  .type input::placeholder { color: var(--ink-soft); opacity: .7; }
  .link {
    background: none; border: none; cursor: pointer; padding: 0;
    font: 600 12.8px var(--font-body); letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink);
  }
  .link:hover { color: var(--pink); }

  /* Footer */
  footer {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  footer a, footer button {
    font: 600 11.5px var(--font-body); letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none; background: none; border: none; cursor: pointer; padding: 0;
  }
  footer a:hover, footer button:hover { color: var(--pink); }
  footer .right { display: flex; gap: 18px; }

  /* Entrance (welcome screen) */
  .entrance { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 0; }
  .entrance p { max-width: 460px; color: var(--ink-soft); font-size: 19px; line-height: 1.5; }
  .key-field { margin-top: 28px; width: min(420px, 100%); border-bottom: 1px solid var(--ink); display: flex; }
  .key-field input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent; padding: 10px 0; text-align: center;
    font: 500 17px var(--font-body); letter-spacing: 0.04em; color: var(--ink);

  .begin {
    margin-top: 32px; background: var(--ink); color: var(--ivory); border: none; border-radius: 999px;

    font: 600 12.8px var(--font-body); letter-spacing: 0.28em; text-transform: uppercase;

  .fine { margin-top: 18px; font-size: 15px !important; font-style: italic; }

  @media (max-width: 520px) {
    .orb { width: 140px; height: 140px; }
    .top { flex-direction: column; align-items: center; gap: 10px; }
  }
</style>

const SPEECH_LANG = { en: "en-US", fr: "fr-FR", it: "it-IT" };

/* =====================================================================
   3. APP
   ===================================================================== */
const API = "https://generativelanguage.googleapis.com/v1beta";
const KEY_STORE = "rebecca_agent_gemini_key";
const $ = (id) => document.getElementById(id);

let lang = (navigator.language || "en").slice(0, 2);
if (!UI[lang]) lang = "en";
let history = [];
let state = "idle";           // idle | listening | thinking | speaking
let audioCtx = null, currentSource = null;
let textModel = null, ttsModel = null, ttsFormat = "classic", ttsBroken = false;

// ---- key storage (only in this browser) ----
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || window.__k || ""; } catch { return window.__k || ""; } };
const setKey = (k) => { window.__k = k; try { localStorage.setItem(KEY_STORE, k); } catch {} };
const clearKey = () => { window.__k = ""; try { localStorage.removeItem(KEY_STORE); } catch {} };

// ---- language + texts ----
function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("tagline").textContent = t.tagline;
  $("entranceText").textContent = t.entrance;
  $("begin").textContent = t.begin;
  $("keyInput").placeholder = t.keyPh;
  $("keyNote").innerHTML = t.keyNote;
  $("textInput").placeholder = t.typePh;
  $("sendText").textContent = t.send;
  const s = $("suggest"); s.innerHTML = "";
  t.chips.forEach(c => { const b = document.createElement("button"); b.className = "chip"; b.textContent = c; b.onclick = () => ask(c); s.appendChild(b); });
  setState(state);
  if (recognizer) recognizer.lang = SPEECH_LANG[lang];
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { lang = b.dataset.lang; applyLang(); });

function setState(s, extra) {
  state = s;
  const t = UI[lang], orb = $("orb");
  orb.className = "orb " + (s === "idle" ? "" : s);
  $("hint").textContent = extra || { idle: t.tap, listening: t.listening, thinking: t.thinking, speaking: t.stop }[s];
}

// ---- entrance ----
function showEntrance() {
  const needKey = !getKey();
  $("entrance").classList.remove("hidden");
  $("stage").classList.add("hidden");
  $("below").classList.add("hidden");
  $("keyField").classList.toggle("hidden", !needKey);
  $("keyNote").classList.toggle("hidden", !needKey);
}
$("keyInput").addEventListener("keydown", e => { if (e.key === "Enter") $("begin").click(); });
$("begin").onclick = async () => {
  if (!getKey()) {
    const k = $("keyInput").value.trim();
    if (!k) { $("keyInput").focus(); return; }
    setKey(k); $("keyInput").value = "";
  }
  unlockAudio();
  $("entrance").classList.add("hidden");
  $("stage").classList.remove("hidden");
  $("below").classList.remove("hidden");
  const g = UI[lang].greeting;
  addTurn("agent", g);                 // greeting is shown and spoken, not sent to Gemini
  await say(g, lang);
};
$("changeKey").onclick = () => { stopAll(); clearKey(); history = []; $("transcript").innerHTML = ""; showEntrance(); };

// ---- transcript ----
function addTurn(who, text) {
  const t = UI[lang];
  const d = document.createElement("div");
  d.className = "turn " + who;
  const label = who === "user" ? t.you : who === "agent" ? AGENT_NAME : "";
  d.innerHTML = (label ? `<div class="who"></div>` : "") + "<p></p>";
  if (label) d.querySelector(".who").textContent = label;
  d.querySelector("p").textContent = text;
  const tr = $("transcript");
  tr.prepend(d);                       // newest on top, right under the orb
}

// ---- Gemini helpers ----
async function gemini(path, body) {
  const res = await fetch(`${API}/${path}`, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "x-goog-api-key": getKey() },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error?.message || `Error ${res.status}`); e.status = res.status; throw e; }
  return data;
}

let modelList = null;
async function listModels() {
  if (modelList) return modelList;
  const d = await gemini("models?pageSize=300");
  modelList = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""));
  return modelList;
}
const ver = (n) => parseFloat((n.match(/(\d+(\.\d+)?)/) || [0, 0])[1]);
const newest = (arr) => arr.sort((a, b) => ver(b) - ver(a))[0];

async function pickTextModel() {
  const all = await listModels();
  if (all.includes("gemini-flash-latest")) return "gemini-flash-latest";
  const flash = all.filter(n => /flash/.test(n) && !/(tts|image|audio|live|embed|lite|thinking|exp)/.test(n));
  return newest(flash) || newest(all.filter(n => /gemini/.test(n) && !/(tts|image|audio|live|embed)/.test(n)));
}
async function pickTtsModel() {
  const all = await listModels();
  const tts = all.filter(n => /tts/.test(n));
  return newest(tts.filter(n => !/lite/.test(n))) || newest(tts);
}

// ---- think: get the reply text + its language ----
async function think() {
  if (!textModel) textModel = await pickTextModel();
  const body = {
    systemInstruction: { parts: [{ text: PERSONA }] },
    contents: history,
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: {
        type: "OBJECT",
        properties: { lang: { type: "STRING", enum: ["en", "fr", "it"] }, reply: { type: "STRING" } },
        required: ["lang", "reply"]
      }
    }
  };
  const d = await gemini(`models/${textModel}:generateContent`, body);
  const raw = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  try { const j = JSON.parse(raw); return { raw, lang: UI[j.lang] ? j.lang : lang, reply: (j.reply || "").trim() }; }
  catch { return { raw, lang, reply: raw.trim() }; }
}

// ---- speak: Gemini TTS with accent, browser voice as fallback ----
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
}
function ttsBody(text, l, format, voice) {
  if (format === "classic") {
    return {
      contents: [{ parts: [{ text: `Read the following text aloud, exactly as written, in the voice of ${VOICE_STYLE[l]}:\n\n${text}` }] }],
      generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } } }
    };
  }
  return {
    contents: [{ parts: [{ text, speechMetadata: { style: VOICE_STYLE[l] } }] }],
    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { voice } } }
  };
}
async function geminiSpeech(text, l) {
  if (!ttsModel) ttsModel = await pickTtsModel();
  if (!ttsModel) throw new Error("no tts model");
  const attempts = [[ttsFormat, VOICE_NAME], [ttsFormat === "classic" ? "new" : "classic", VOICE_NAME], ["classic", "Kore"]];
  let lastErr;
  for (const [fmt, voice] of attempts) {
    try {
      const d = await gemini(`models/${ttsModel}:generateContent`, ttsBody(text, l, fmt, voice));
      const part = (d.candidates?.[0]?.content?.parts || []).find(p => p.inlineData?.data);
      if (!part) throw new Error("no audio");
      ttsFormat = fmt;
      return part.inlineData;
    } catch (e) { lastErr = e; if (e.status === 401 || e.status === 403 || e.status === 429) break; }
  }
  throw lastErr;
}
function playPcm(inline) {
  return new Promise((resolve) => {
    const rate = parseInt((inline.mimeType || "").match(/rate=(\d+)/)?.[1] || "24000", 10);
    const bin = atob(inline.data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const pcm = new Int16Array(bytes.buffer, 0, Math.floor(bytes.length / 2));
    unlockAudio();
    const buf = audioCtx.createBuffer(1, pcm.length, rate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination);
    src.onended = () => { if (currentSource === src) currentSource = null; resolve(); };
    currentSource = src; src.start();
  });
}
function browserSpeech(text, l) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LANG[l];
    const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(l));
    const female = /(female|alice|federica|elsa|paola|amélie|amelie|audrey|aurélie|marie|julie|samantha|victoria|karen|serena|moira|google)/i;
    u.voice = voices.find(v => female.test(v.name)) || voices[0] || null;
    u.rate = 0.98;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}
async function say(text, l) {
  setState("thinking");
  try {
    if (ttsBroken) throw new Error("skip");
    const inline = await geminiSpeech(text, l);
    if (state !== "thinking") return;          // stopped meanwhile
    setState("speaking");
    await playPcm(inline);
  } catch (e) {
    if (e.status === 429 || e.message === "no tts model") ttsBroken = true;
    if (state !== "thinking") return;
    setState("speaking");
    await browserSpeech(text, l);
  }
  if (state === "speaking") setState("idle");
}
function stopAll() {
  try { currentSource && currentSource.stop(); } catch {}
  currentSource = null;
  try { speechSynthesis.cancel(); } catch {}
  try { listening && recognizer.abort(); } catch {}
  setState("idle");
}

// ---- conversation ----
async function ask(text) {
  text = (text || "").trim();
  if (!text || state === "thinking") return;
  stopAll();
  $("heard").textContent = "";
  addTurn("user", text);
  history.push({ role: "user", parts: [{ text }] });
  setState("thinking");
  try {
    const r = await think();
    history.push({ role: "model", parts: [{ text: r.raw }] });
    addTurn("agent", r.reply);
    await say(r.reply, r.lang);
  } catch (e) {
    history.pop();
    addTurn("error", [400, 401, 403].includes(e.status) ? UI[lang].keyErr : e.message);
    setState("idle");
  }
}

// ---- listening (speech to text in the browser) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, listening = false, finalText = "";
if (SR) {
  recognizer = new SR();
  recognizer.interimResults = true;
  recognizer.continuous = false;
  recognizer.onstart = () => { listening = true; finalText = ""; setState("listening"); };
  recognizer.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    $("heard").textContent = (finalText + interim).trim();
  };
  recognizer.onerror = (e) => { if (e.error === "not-allowed") setState("idle", UI[lang].blocked); else if (e.error !== "aborted") setState("idle", UI[lang].missed); };
  recognizer.onend = () => {
    listening = false;
    if (finalText.trim()) ask(finalText.trim());
    else if (state === "listening") setState("idle", UI[lang].missed);
  };
}
$("orb").onclick = () => {
  unlockAudio();
  if (state === "speaking" || state === "listening") { stopAll(); return; }
  if (state === "thinking") return;
  if (!recognizer) { setState("idle", UI[lang].noMic); $("textInput").focus(); return; }
  recognizer.lang = SPEECH_LANG[lang];
  try { recognizer.start(); } catch {}
};

// ---- typing ----
$("sendText").onclick = () => { unlockAudio(); const v = $("textInput").value; $("textInput").value = ""; ask(v); };
$("textInput").addEventListener("keydown", e => { if (e.key === "Enter") $("sendText").click(); });

if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
applyLang();
showEntrance();
</script>
</body>
</html>
